version: 1
project_name: code-brain
worker:
  idle_ttl_seconds: 1800
hot_path:
  target_ms: 200
features:
  embeddings: false
  remote_llm: false
  external_notifications: false
# remote_memory (Cloudflare-backed cross-device context) removed — .ai/ git sync
# replaces it. memory_sync below covers the same cross-machine need without a
# third-party provider or a hook-spawned network call.
memory_sync:
  enabled: false  # deprecated no-op; run `ai memory sync` explicitly
cache:
  sqlite_path: .ai/cache/code.sqlite
search:
  retriever: bm25
  index_vendored_runtime: true   # source repo only: .ai/runtime IS the product source
manifest:
  path: .ai/generated/manifest.json
autoresearch:
  schema_version: 1
  enable_web_ingest: false
  loop:
    enable: false   # Stage 2 ratchet loop auto-executes code — OFF by default (PRD §5)
  search:
    corpus_threshold_tokens: 50000   # Stage 1 dense activates only above this (PRD 4.6)
  # trust_hosts (optional): server-side domain to tier allowlist; callers cannot self-declare.
  # Add entries under trust_hosts, e.g.  arxiv.org: primary  (single-label keys are rejected).
